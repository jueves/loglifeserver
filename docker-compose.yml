version: '3.8'

services:
  api:
    build: .
    ports:
      - "3001:3001"
    volumes:
      - ./data:/app/data
      - ./certs:/app/certs  # Mount SSL certificates (optional)
    environment:
      - LOGLIFE_API_KEY=${LOGLIFE_API_KEY}
      - DB_PATH=${DB_PATH}
      - PORT=3001
      # Uncomment to enable HTTPS
      # - SSL_CERT_PATH=${SSL_CERT_PATH}
      # - SSL_KEY_PATH=${SSL_KEY_PATH}
    restart: unless-stopped
